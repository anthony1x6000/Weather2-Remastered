name: Build

# The 1.12.2 line is the only one this workflow targets: it is the branch with the mixins and the
# extended-render-distance code, so a build here is the one that can catch a regression without
# launching a client.
on:
  push:
    branches:
      - '1.12.2-2.9'
      - 'fix/**'
      - 'ci/**'
  pull_request:
    branches:
      - '1.12.2-2.9'
  workflow_dispatch:

permissions:
  contents: read

env:
  # CoroUtil is a compile dependency with no Maven or Modrinth publication for 1.12.2, so it is built
  # from its own source, pinned to a commit.
  COROUTIL_REF: 1b8f7298340d2cac9507471971b85924d2652123
  COROUTIL_JAR: coroutil-1.12.1-1.2.37.jar

jobs:
  build:
    name: Gradle build (JDK 8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # build.gradle reads libs/${coroutil_jar}, and /libs is gitignored, so a clean checkout has
      # nothing to compile against. Take it from the checkout when it is there, else from
      # COROUTIL_JAR_URL, else build it (its own repo ships no gradlew, hence the pinned Gradle 3.4).
      - name: Cache the CoroUtil build
        if: ${{ vars.COROUTIL_JAR_URL == '' }}
        uses: actions/cache@v6
        with:
          path: libs/coroutil-1.12.1-1.2.37.jar
          key: coroutil-${{ runner.os }}-${{ env.COROUTIL_REF }}

      - name: Provide CoroUtil
        env:
          FALLBACK_URL: ${{ vars.COROUTIL_JAR_URL }}
        run: |
          set -euo pipefail
          mkdir -p libs
          if [ -s "libs/$COROUTIL_JAR" ]; then
            echo "libs/$COROUTIL_JAR already present"
            exit 0
          fi
          if [ -n "${FALLBACK_URL:-}" ]; then
            echo "fetching $COROUTIL_JAR from COROUTIL_JAR_URL"
            curl -fsSL --retry 3 -o "libs/$COROUTIL_JAR" "$FALLBACK_URL"
            test -s "libs/$COROUTIL_JAR"
            exit 0
          fi
          echo "building CoroUtil $COROUTIL_REF from source"
          git clone --quiet --filter=blob:none https://github.com/Corosauce/CoroUtil.git /tmp/coroutil
          git -C /tmp/coroutil checkout --quiet "$COROUTIL_REF"
          curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-3.4-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          (cd /tmp/coroutil && /tmp/gradle-3.4/bin/gradle build --no-daemon --console=plain -q)
          cp "/tmp/coroutil/build/libs/$COROUTIL_JAR" "libs/$COROUTIL_JAR"
          test -s "libs/$COROUTIL_JAR"

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: weather2-remastered-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
